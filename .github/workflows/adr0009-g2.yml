name: ADR-0009 G2 static artifact validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/TechnicalValidation/ADR0009.G2/**'
      - 'tests/TechnicalValidation/ADR0009.G2.CI/**'
      - 'tests/TechnicalValidation/ADR0009.G1/**'
      - 'tests/TechnicalValidation/ADR0009.G1.CI/**'
      - '.github/workflows/adr0009-g2.yml'
      - '.gitattributes'
      - 'docs/architecture/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test offline validators using temporary fixtures
        run: python3 -B -m unittest discover -s tests/TechnicalValidation/ADR0009.G2.CI -p test_validate_g2.py -v
      - name: Validate historical artifacts without executing them
        run: python3 -B tests/TechnicalValidation/ADR0009.G2.CI/validate_g2.py
      - name: Confirm approved packages were not modified
        run: git diff --exit-code -- tests/TechnicalValidation/ADR0009.G1 tests/TechnicalValidation/ADR0009.G2
      - name: Check whitespace with scoped historical log exceptions
        run: git diff --check origin/main...HEAD
